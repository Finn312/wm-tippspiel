<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Judo-WM Tippspiel{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #f0f0f2;
      --card-bg: #fafafa;
      --card-bg-alt: #f4f4f5;
      --text: #18181b;
      --muted: #6b6b70;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --accent-contrast: #ffffff;
      --border: #e4e4e7;
      --locked-bg: #dc2626;
      --locked: #b91c1c;
      --success: #16a34a;
      --gold: #eab308;
      --gold-contrast: #3f2d00;
      --gold-bg: rgba(234, 179, 8, 0.14);
      --silver: #94a3b8;
      --silver-contrast: #1f2937;
      --silver-bg: rgba(100, 116, 139, 0.12);
      --bronze: #b45309;
      --bronze-contrast: #ffffff;
      --bronze-bg: rgba(180, 83, 9, 0.14);
      --shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 8px 20px rgba(24, 24, 27, 0.07);
      --card-watermark: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20140%22%3E%3Cg%20fill%3D%22%23000000%22%20opacity%3D%220.06%22%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%2238%2C40%2066%2C40%2074%2C92%2030%2C92%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M40%2092%20L30%20132%20L40%20132%20L48%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M62%2092%20L74%20128%20L64%20132%20L54%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M64%2046%20L108%2054%20L104%2062%20L60%2054%20Z%22%2F%3E%3Ccircle%20cx%3D%22148%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%22162%2C40%20134%2C40%20126%2C92%20170%2C92%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M160%2092%20L170%20132%20L160%20132%20L152%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M138%2092%20L126%20128%20L136%20132%20L146%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M136%2046%20L92%2054%20L96%2062%20L140%2054%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card-bg: #1c1c1f;
        --card-bg-alt: #212124;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #6366f1;
        --accent-dark: #4f46e5;
        --accent-soft: rgba(99, 102, 241, 0.18);
        --border: #3f3f46;
        --locked-bg: #ef4444;
        --locked: #fca5a5;
        --success: #22c55e;
        --gold: #facc15;
        --gold-contrast: #3f2d00;
        --gold-bg: rgba(250, 204, 21, 0.18);
        --silver: #cbd5e1;
        --silver-contrast: #1f2937;
        --silver-bg: rgba(203, 213, 225, 0.14);
        --bronze: #d97706;
        --bronze-contrast: #1a1206;
        --bronze-bg: rgba(217, 119, 6, 0.18);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 24px rgba(0, 0, 0, 0.35);
        --card-watermark: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20140%22%3E%3Cg%20fill%3D%22%23ffffff%22%20opacity%3D%220.07%22%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%2238%2C40%2066%2C40%2074%2C92%2030%2C92%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M40%2092%20L30%20132%20L40%20132%20L48%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M62%2092%20L74%20128%20L64%20132%20L54%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M64%2046%20L108%2054%20L104%2062%20L60%2054%20Z%22%2F%3E%3Ccircle%20cx%3D%22148%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%22162%2C40%20134%2C40%20126%2C92%20170%2C92%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M160%2092%20L170%20132%20L160%20132%20L152%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M138%2092%20L126%20128%20L136%20132%20L146%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M136%2046%20L92%2054%20L96%2062%20L140%2054%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
      }
    }
    :root[data-theme="dark"] {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --card-bg-alt: #212124;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --border: #3f3f46;
      --locked-bg: #ef4444;
      --locked: #fca5a5;
      --success: #22c55e;
      --gold: #facc15;
      --gold-contrast: #3f2d00;
      --gold-bg: rgba(250, 204, 21, 0.18);
      --silver: #cbd5e1;
      --silver-contrast: #1f2937;
      --silver-bg: rgba(203, 213, 225, 0.14);
      --bronze: #d97706;
      --bronze-contrast: #1a1206;
      --bronze-bg: rgba(217, 119, 6, 0.18);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 24px rgba(0, 0, 0, 0.35);
      --card-watermark: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20140%22%3E%3Cg%20fill%3D%22%23ffffff%22%20opacity%3D%220.07%22%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%2238%2C40%2066%2C40%2074%2C92%2030%2C92%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M40%2092%20L30%20132%20L40%20132%20L48%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M62%2092%20L74%20128%20L64%20132%20L54%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M64%2046%20L108%2054%20L104%2062%20L60%2054%20Z%22%2F%3E%3Ccircle%20cx%3D%22148%22%20cy%3D%2228%22%20r%3D%2211%22%2F%3E%3Cpolygon%20points%3D%22162%2C40%20134%2C40%20126%2C92%20170%2C92%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%2276%22%20width%3D%2240%22%20height%3D%226%22%2F%3E%3Cpath%20d%3D%22M160%2092%20L170%20132%20L160%20132%20L152%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M138%2092%20L126%20128%20L136%20132%20L146%2096%20Z%22%2F%3E%3Cpath%20d%3D%22M136%2046%20L92%2054%20L96%2062%20L140%2054%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    nav {
      display: flex;
      gap: 1.25rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }
    nav .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      margin-right: 0.5rem;
    }
    nav .brand-icon { color: var(--accent); flex: none; }
    nav a:not(.brand) { color: var(--text); text-decoration: none; font-weight: 600; }
    nav a:not(.brand):hover { color: var(--accent); }
    .brand { order: 1; }
    .nav-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem;
      border-radius: 10px;
      box-shadow: none;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .nav-toggle:hover { opacity: 0.85; }
    .nav-menu { order: 2; display: flex; align-items: center; gap: 1.25rem; flex: 1; flex-wrap: wrap; }
    .nav-actions { order: 3; display: flex; align-items: center; gap: 0.75rem; flex: none; }
    .nav-user { display: flex; align-items: center; gap: 0.75rem; }
    nav a.nav-login-btn {
      display: inline-flex;
      align-items: center;
      color: var(--accent-contrast);
      background: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 10px;
      font-weight: 700;
    }
    nav a.nav-login-btn:hover { color: var(--accent-contrast); opacity: 0.9; }
    @media (max-width: 640px) {
      .nav-toggle { display: inline-flex; }
      .nav-actions { order: 2; margin-left: auto; }
      .nav-menu {
        order: 3;
        display: none;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        flex: none;
        gap: 0.15rem;
        margin-top: 0.75rem;
      }
      .nav-menu.open { display: flex; }
      .nav-menu a:not(.brand) { padding: 0.65rem 0.4rem; border-radius: 8px; }
      .nav-menu a:not(.brand):hover { background: var(--accent-soft); }
    }
    @media (max-width: 385px) {
      nav .brand span { display: none; }
      nav .brand { margin-right: 0; }
    }
    main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .card {
      overflow: hidden;
      background:
        var(--card-watermark) no-repeat bottom -14px right -10px / 170px auto,
        linear-gradient(180deg, var(--card-bg-alt) 0%, var(--card-bg) 14%);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    .card h3 { margin-top: 0; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .badge.open { background: var(--accent); color: #ffffff; }
    .badge.locked { background: var(--locked-bg); color: #ffffff; }
    .countdown { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
    th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
    th { color: var(--muted); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tbody tr:nth-child(even) { background: var(--card-bg-alt); }
    tbody tr:hover { background: var(--accent-soft); }
    a.user-link { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    a.user-link:hover { text-decoration: underline; }
    select, input, button {
      font-size: 1rem;
      padding: 0.55rem 0.65rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
    }
    button:hover { opacity: 0.92; }
    label { display: block; margin-top: 1rem; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    form.tip-form { display: flex; flex-direction: column; }
    .error { color: var(--locked); font-weight: 600; margin: 0.5rem 0; }
    .success { color: var(--success); font-weight: 600; margin: 0.5rem 0; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .rank-1 { font-weight: 700; background: rgba(234, 179, 8, 0.14); }
    .rank-1 td:first-child { border-left: 3px solid var(--gold); }
    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 800;
      margin-right: 0.4rem;
      vertical-align: middle;
      flex: none;
    }
    .rank-chip.gold { background: var(--gold); color: var(--gold-contrast); }
    .rank-chip.silver { background: var(--silver); color: var(--silver-contrast); }
    .rank-chip.bronze { background: var(--bronze); color: var(--bronze-contrast); }
    td.td-gold, td.td-silver { vertical-align: middle; }
    td.td-gold, td.td-silver, td.td-bronze {
      border-left: 5px solid transparent;
      padding-left: 0.75rem;
    }
    td.td-gold { background: var(--gold-bg); border-left-color: var(--gold); }
    td.td-silver { background: var(--silver-bg); border-left-color: var(--silver); }
    td.td-bronze { background: var(--bronze-bg); border-left-color: var(--bronze); }
    .bronze-picks { display: flex; flex-direction: column; }
    .bronze-picks > div { padding: 0.2rem 0; }
    .bronze-picks > div + div { border-top: 1px dashed var(--border); margin-top: 0.1rem; padding-top: 0.3rem; }
    .tip-ranks { display: block; }
    .rank-line {
      padding: 0.35rem 0.5rem 0.35rem 0.65rem;
      border-left: 5px solid;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }
    .rank-line + .rank-line { margin-top: 0.35rem; }
    .rank-line.gold { border-color: var(--gold); background: var(--gold-bg); }
    .rank-line.silver { border-color: var(--silver); background: var(--silver-bg); }
    .rank-line.bronze { border-color: var(--bronze); background: var(--bronze-bg); }
    .tip-cards-mobile { display: none; }
    .tip-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      background: var(--card-bg-alt);
    }
    .tip-card + .tip-card { margin-top: 0.75rem; }
    .tip-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      overflow-wrap: break-word;
    }
    .tip-card-points { color: var(--muted); font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
    .tip-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }
    @media (max-width: 640px) {
      .tip-table-wrap { display: none; }
      .tip-cards-mobile { display: block; }
      .card {
        background: linear-gradient(180deg, var(--card-bg-alt) 0%, var(--card-bg) 14%);
      }
    }
    .name-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .name-tile:hover { border-color: var(--accent); }
    details.info-toggle summary {
      cursor: pointer;
      font-weight: 600;
      padding: 0.25rem 0;
    }
    details.info-toggle summary::marker { content: ""; }
    details.info-toggle[open] summary { margin-bottom: 0.75rem; }
    .info-content h3 { margin: 1.1rem 0 0.35rem; }
    .info-content h3:first-child { margin-top: 0; }
    .info-content p { margin: 0.25rem 0 0.6rem; }
    .info-content ul { margin: 0.25rem 0 0.6rem 1.2rem; padding: 0; }
    .info-content li { margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">
      <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="10" width="20" height="4" rx="1" fill="currentColor" opacity="0.85"/>
        <path d="M9 6 L15 6 L12 12 Z" fill="currentColor"/>
        <path d="M9 18 L15 18 L12 12 Z" fill="currentColor"/>
      </svg>
      <span>Judo-Tippspiel</span>
    </a>
    <div class="nav-menu" id="nav-menu">
      <a href="/">Tagesansicht</a>
      {% if current_user %}<a href="/my-tips">Meine Tipps</a>{% endif %}
      <a href="/leaderboard">Leaderboard</a>
      <a href="/info">Info</a>
    </div>
    <div class="nav-actions">
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="nav-menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      {% if current_user %}
        <div class="nav-user">
          <span class="muted">{{ current_user.name }}</span>
          <form method="post" action="/logout" style="margin:0;">
            <button type="submit" style="padding:0.3rem 0.6rem;">Logout</button>
          </form>
        </div>
      {% else %}
        <a href="/login" class="nav-login-btn">Login</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function startCountdowns() {
      document.querySelectorAll('[data-countdown]:not([data-countdown-init])').forEach(function (el) {
        el.setAttribute('data-countdown-init', '1');
        const target = new Date(el.dataset.countdown).getTime();
        function tick() {
          const diff = target - Date.now();
          if (diff <= 0) {
            el.textContent = 'Kampf läuft / vorbei';
            return;
          }
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          el.textContent = 'Start in ' + h + 'h ' + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
        }
        tick();
        setInterval(tick, 1000);
      });
    }
    document.addEventListener('DOMContentLoaded', startCountdowns);
    document.body.addEventListener('htmx:afterSwap', startCountdowns);

    (function () {
      const toggle = document.getElementById('nav-toggle');
      const menu = document.getElementById('nav-menu');
      if (!toggle || !menu) return;
      function closeMenu() {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
      function openMenu() {
        menu.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
      }
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        if (menu.classList.contains('open')) {
          closeMenu();
        } else {
          openMenu();
        }
      });
      document.addEventListener('click', function (e) {
        if (menu.classList.contains('open') && !menu.contains(e.target) && !toggle.contains(e.target)) {
          closeMenu();
        }
      });
    })();
  </script>
</body>
</html>
