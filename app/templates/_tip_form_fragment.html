{% if wc.locked %}
  <p class="error">Das Tipp-Fenster ist bereits geschlossen.</p>
{% else %}
  {% if success %}<p class="success">Gespeichert.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="tip-form" hx-post="/weight-classes/{{ wc.id }}/tip" hx-target="#tip-form-wrapper" hx-swap="innerHTML">
    <label for="platz_1"><span class="rank-chip gold">1</span>Platz 1</label>
    <select name="platz_1" id="platz_1">
      <option value="">–</option>
      {% for a in athletes %}
        <option value="{{ a.id }}" {% if tip and tip.platz_1 == a.id %}selected{% endif %}>{{ a.name|athlete_display }}</option>
      {% endfor %}
    </select>

    <label for="platz_2"><span class="rank-chip silver">2</span>Platz 2</label>
    <select name="platz_2" id="platz_2">
      <option value="">–</option>
      {% for a in athletes %}
        <option value="{{ a.id }}" {% if tip and tip.platz_2 == a.id %}selected{% endif %}>{{ a.name|athlete_display }}</option>
      {% endfor %}
    </select>

    <label for="platz_3a"><span class="rank-chip bronze">3</span>Bronze <span class="muted">– Reihenfolge egal</span></label>
    <select name="platz_3a" id="platz_3a">
      <option value="">–</option>
      {% for a in athletes %}
        <option value="{{ a.id }}" {% if tip and tip.platz_3a == a.id %}selected{% endif %}>{{ a.name|athlete_display }}</option>
      {% endfor %}
    </select>
    <label for="platz_3b"><span class="rank-chip bronze">3</span>Bronze</label>
    <select name="platz_3b" id="platz_3b">
      <option value="">–</option>
      {% for a in athletes %}
        <option value="{{ a.id }}" {% if tip and tip.platz_3b == a.id %}selected{% endif %}>{{ a.name|athlete_display }}</option>
      {% endfor %}
    </select>

    <button type="submit" style="margin-top:1rem;">Speichern</button>
  </form>
{% endif %}
