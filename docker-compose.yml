services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wm
      POSTGRES_PASSWORD: wm
      POSTGRES_DB: wm
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wm -d wm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://wm:wm@db:5432/wm
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic

volumes:
  db_data:
